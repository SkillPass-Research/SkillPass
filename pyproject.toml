[project]
name = "skillpass"
version = "0.1.0"
description = "SkillPass: model-bound representations (S-Passes) of agent skills that only the authorized LLM can use."
requires-python = ">=3.12,<3.13"
dependencies = [
    "huggingface-hub>=1.5,<2",
    "numpy>=2.0",
    "python-dotenv>=1.0",
    "pyyaml>=6.0.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.7.0",
]
# Needed to make S-Passes and to run any model (`uv sync --group gpu`).
gpu = [
    "accelerate>=1.15.0",
    "pandas>=2.2",
    "safetensors>=0.5",
    "torch>=2.6",
    "transformers>=5.18.0",
]

# torch from the CUDA 12.6 index on Linux/Windows; macOS keeps the PyPI build (no CUDA).
[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu126", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["skillpass"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gpu: needs torch, a model or a GPU"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
